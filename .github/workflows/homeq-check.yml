name: HomeQ check

# Runs one HomeQ check on GitHub's servers, so alerts work while your PC is off.
# Every 10 minutes (offset to :02, :12, ... to avoid the busy :00). GitHub may delay busy schedules a few minutes.
# This repo is PUBLIC, so Actions minutes are free and unlimited. If it's ever made private again,
# change back to hourly ('17 * * * *'): every 10 min would use ~8,600 of the 2,000 free private minutes/month.
# Note: GitHub pauses schedules in public repos after 60 days without commits; it emails you to re-enable.
on:
  schedule:
    - cron: '2-59/10 * * * *'
  workflow_dispatch:   # "Run workflow" button for manual tests

permissions:
  contents: read

concurrency:
  group: homeq-check
  cancel-in-progress: false

jobs:
  check:
    # Pinned: Playwright 1.52 doesn't support Chromium on ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Run logs are public in a public repo. GitHub masks each secret's whole value, but ALERT_EMAIL_TO
      # holds several addresses, so also mask every single address in case one is printed on its own.
      - name: Hide email addresses in logs
        env:
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        run: |
          for a in $(printf '%s,%s' "$ALERT_EMAIL_TO" "$MAIL_USERNAME" | tr ',' ' '); do
            [ -n "$a" ] && echo "::add-mask::$a"
          done
          echo "Email addresses masked"

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn --batch-mode --quiet -DskipTests package

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('pom.xml') }}

      - name: Install Chromium for Playwright
        run: mvn --batch-mode --quiet exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      # The "already alerted" list (H2 database in ./data) is carried from run to run in the Actions cache.
      - name: Restore seen-listings database
        uses: actions/cache/restore@v4
        with:
          path: data
          key: homeq-seen-${{ github.run_id }}
          restore-keys: homeq-seen-

      # Optional: your saved HomeQ login (secret HOMEQ_SESSION, renewed weekly by scripts/update-homeq-login.ps1)
      # lets alerts include your queue position. It's written only for this run and deleted before caching.
      - name: Load HomeQ login
        env:
          HOMEQ_SESSION: ${{ secrets.HOMEQ_SESSION }}
        run: |
          mkdir -p data
          if [ -n "$HOMEQ_SESSION" ]; then printf '%s' "$HOMEQ_SESSION" > data/homeq-session.json; echo "HomeQ login loaded"; else echo "No HomeQ login secret: queue positions off"; fi

      - name: Check HomeQ and send alerts
        env:
          HOMEQ_RUN_ONCE: 'true'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          # --- Search: your districts and requirements (not secret) ---
          HOMEQ_SEARCH_URL: https://www.homeq.se/search?selectedShapes=face.21,face.22,face.19,district.107056,face.24,face.55,face.49,face.50,face.40,face.44,district.107083,district.107085,face.41,face.39,face.43
          HOMEQ_MAX_PAGES: '8'
          HOMEQ_MIN_ROOMS: '3'
          HOMEQ_MAX_RENT: '15000'
          HOMEQ_ALLOWED_AREAS: Göteborg
          # --- Alerts: set in repo Settings > Secrets and variables > Actions ---
          ALERT_CHANNELS: ${{ vars.ALERT_CHANNELS || 'email' }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
        run: java -jar target/homeq-rental-alert-*.jar

      - name: Remove HomeQ login before caching
        if: always()
        run: rm -f data/homeq-session.json

      - name: Save seen-listings database
        if: always() && hashFiles('data/**') != ''
        uses: actions/cache/save@v4
        with:
          path: data
          key: homeq-seen-${{ github.run_id }}-${{ github.run_attempt }}
